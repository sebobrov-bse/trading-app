[project]
name = "trading-app"
version = "0.1.0"
description = "Trading software: FastAPI + SQLite + Backtrader"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "app",
    "app.api",
    "app.api.routes",
    "app.services",
    "app.repositories",
    "app.models",
    "app.schemas",
    "app.data_providers",
    "app.brokers",
    "app.strategies",
    "app.backtest",
]

[tool.ruff]
line-length = 100
target-version = "py311"